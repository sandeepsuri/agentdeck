# Issue #90: one way to run the relay — Fly.io terminates TLS, so phones and
# the Mac use wss://<app>.fly.dev. Rename the app, then from the repo root:
#   fly launch --no-deploy --copy-config -c relay/fly.toml
#   fly secrets set APNS_KEY_ID=... APNS_TEAM_ID=... APNS_TOPIC=...   (optional, with the key below)
#   fly deploy -c relay/fly.toml
app = "agentdeck-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy sets X-Forwarded-For, so per-address limits see the phone, not the proxy.
  RELAY_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
